<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 3 - jQuery Methods</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    .box { width: 100px; height: 100px; background: steelblue; display: inline-block; margin: 8px; }
  </style>
</head>
<body>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <br>

  <button id="hideBtn">Hide</button>
  <button id="showBtn">Show</button>
  <button id="fadeOutBtn">Fade Out</button>
  <button id="fadeInBtn">Fade In</button>
  <button id="toggleBtn">Toggle</button>
  <button id="chainBtn">Slide Up, Delay, Slide Down (chained)</button>

  <script>
    $(document).ready(function () {
      $('#hideBtn').click(function () { $('.box').hide(); });
      $('#showBtn').click(function () { $('.box').show(); });
      $('#fadeOutBtn').click(function () { $('.box').fadeOut(); });
      $('#fadeInBtn').click(function () { $('.box').fadeIn(); });
      $('#toggleBtn').click(function () { $('.box').toggle(); });

      // Bonus: chained methods
      $('#chainBtn').click(function () {
        $('.box').slideUp().delay(1000).slideDown();
      });
    });
  </script>
</body>
</html>
