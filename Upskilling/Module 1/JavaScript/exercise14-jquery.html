<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 14 - jQuery and JS Frameworks</title>
  <style>
    .eventCardEl { background: white; border: 1px solid #cbd5e1; padding: 10px; margin: 8px 0; display: none; }
  </style>
</head>
<body>
  <h1>jQuery Simplifies DOM Tasks</h1>

  <button id="registerBtn">Register</button>
  <div class="eventCardEl" id="card1">Farmers Market - registration confirmed!</div>

  <p>
    <strong>Why move to a framework like React or Vue?</strong>
    Frameworks manage UI state and re-rendering automatically, which scales far better
    than manually tracking DOM updates with jQuery once an app grows past a few
    interactive components.
  </p>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $('#registerBtn').click(function () {
      $('#card1').fadeIn(400, function () {
        setTimeout(() => {
          $('#card1').fadeOut(400);
        }, 2000);
      });
    });
  </script>
</body>
</html>
